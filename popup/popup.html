<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能书签同步</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
          </svg>
        </div>
        <div class="header-copy">
          <h1 class="header-title">智能书签</h1>
          <p class="header-subtitle">本地浏览与同步控制</p>
        </div>
      </div>

      <div class="header-right">
        <button id="btn-theme-toggle" class="icon-btn" title="切换主题">
          <span class="theme-icon">🌙</span>
        </button>
        <button id="btn-settings" class="icon-btn" title="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </div>
    </header>

    <section class="toolbar">
      <div class="search-bar">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" id="search-input" placeholder="搜索书签..." autocomplete="off">
      </div>

      <nav class="tabs">
        <button class="tab active" data-tab="bookmarks">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
          </svg>
          书签
        </button>
        <button class="tab" data-tab="sync">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10" />
            <polyline points="1 20 1 14 7 14" />
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
          </svg>
          同步
        </button>
      </nav>
    </section>

    <section class="overview-strip" aria-label="书签概览">
      <div class="overview-card">
        <span class="overview-label">书签总数</span>
        <strong id="overview-bookmarks">-</strong>
      </div>
      <div class="overview-card">
        <span class="overview-label">文件夹</span>
        <strong id="overview-folders">-</strong>
      </div>
      <div class="overview-card overview-card-wide">
        <span class="overview-label">当前状态</span>
        <strong id="overview-context">正在载入书签</strong>
      </div>
    </section>

    <div id="panel-bookmarks" class="panel active">
      <section class="panel-card panel-card-tree">
        <div class="panel-card-head">
          <div>
            <h2 class="panel-title">本地书签</h2>
            <p class="panel-desc">展开目录，快速查看当前浏览器中的书签结构。</p>
          </div>
        </div>

        <div id="bookmark-tree" class="bookmark-tree">
          <div class="loading-placeholder">
            <div class="spinner"></div>
            <p>加载书签中...</p>
          </div>
        </div>
      </section>
    </div>

    <div id="panel-sync" class="panel">
      <div class="sync-shell">
        <section class="panel-card sync-summary-card">
          <div class="sync-status-top">
            <div class="sync-status-marker">
              <div class="status-dot" id="sync-status-dot"></div>
              <span class="sync-status-label">同步连接</span>
            </div>
            <span id="sync-platform-badge" class="status-badge">未配置</span>
          </div>
          <div id="sync-status-text" class="sync-status-main">未配置同步</div>
          <p class="sync-status-desc">上传会覆盖远端快照；下载与历史恢复会覆盖本地书签。适合在你确认目标版本后执行。</p>
        </section>

        <section class="panel-card">
          <div class="panel-card-head panel-card-head-compact">
            <div>
              <h2 class="panel-title">覆盖操作</h2>
              <p class="panel-desc">两个动作都会直接改写目标侧数据。</p>
            </div>
          </div>

          <div class="sync-action-grid">
            <div class="sync-action-item">
              <button id="btn-sync-upload" class="action-btn primary" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="16 16 12 12 8 16" />
                  <line x1="12" y1="12" x2="12" y2="21" />
                  <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" />
                </svg>
                上传并替换远端
              </button>
              <p class="sync-action-note">将当前本地书签完整写入远端文件。</p>
            </div>

            <div class="sync-action-item">
              <button id="btn-sync-download" class="action-btn secondary" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="8 17 12 21 16 17" />
                  <line x1="12" y1="12" x2="12" y2="21" />
                  <path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" />
                </svg>
                下载并替换本地
              </button>
              <p class="sync-action-note">用远端快照完整替换当前本地书签。</p>
            </div>
          </div>
        </section>

        <section class="panel-card sync-history-card">
          <div class="panel-card-head panel-card-head-compact">
            <div>
              <h2 class="panel-title">历史版本</h2>
              <p class="panel-desc">查看最近同步记录，并按版本恢复到本地。</p>
            </div>
            <button id="btn-sync-load-versions" class="micro-action" disabled>刷新</button>
          </div>
          <div id="popup-sync-versions" class="popup-sync-versions hidden"></div>
        </section>

        <div id="sync-result" class="result-box hidden"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="popup.js" type="module"></script>
</body>

</html>
